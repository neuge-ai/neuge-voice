name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libportaudio2 libportaudiocpp0 portaudio19-dev

      - name: Install macOS Dependencies
        if: runner.os == 'macOS'
        run: |
          brew install portaudio

      - name: Build Python Backend
        run: |
          uv sync
          uv run python build_backend.py

      - name: Install Node Dependencies
        working-directory: ./apps/web
        run: npm ci

      - name: Build and Package Electron App
        working-directory: ./apps/web
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            npm run electron:build -- --linux --publish never
          elif [ "$RUNNER_OS" = "macOS" ]; then
            npm run electron:build -- --mac --publish never
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-binaries-${{ matrix.os }}
          if-no-files-found: error
          path: |
            apps/web/release/*.AppImage
            apps/web/release/*.deb
            apps/web/release/*.dmg
            apps/web/release/*.zip

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.AppImage
            artifacts/*.deb
            artifacts/*.dmg
            artifacts/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
