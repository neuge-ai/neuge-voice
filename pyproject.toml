[project]
name = "nextgen-voice-agent"
version = "0.1.0"
description = "Flexible voice agent backend with browser and future phone transports."
requires-python = ">=3.12"
dependencies = [
  "click>=8.1.0",
  "fastapi>=0.115.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "nvidia-riva-client>=2.25.1",
  "uvicorn[standard]>=0.30.0",
  "aiortc>=1.9.0",
  "elevenlabs>=1.0.2",
  "litellm>=1.0.0",
  "sarvamai>=0.1.0",
  "numpy>=2.4.6",
  "keyring>=25.7.0",
  "tomli-w>=1.2.0",
  "pyinstaller>=6.20.0",
]

[project.scripts]
neuge = "nextgen_voice_agent.main:main"
neuge-voice = "nextgen_voice_agent.main:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nextgen_voice_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
